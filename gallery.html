<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">

    <title>גלריה | לאה בודיק</title>
    <meta name="description" content="גלריה - אדריכלות ועיצוב פנים יוקרתי על ידי לאה בודיק">
    <meta name="robots" content="index, follow">

    <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%23c9a962'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Frank+Ruhl+Libre:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/public/css/style.css">

    <style>
        /* Gallery page-specific styles */
        .gallery-page {
            padding-top: 140px;
            padding-bottom: 100px;
            min-height: 100vh;
        }
        @media (max-width: 760px) {
            .gallery-page { padding-top: 110px; padding-bottom: 70px; }
        }

        .gallery-back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--fg-mute);
            text-transform: uppercase;
            margin-bottom: 32px;
            transition: color 0.3s, gap 0.3s;
        }
        .gallery-back:hover { color: var(--gold); gap: 18px; }
        .gallery-back::before { content: "→"; color: var(--gold); }

        .gallery-hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 80px;
            padding-bottom: 56px;
            border-bottom: 1px solid var(--line);
        }
        @media (max-width: 760px) { .gallery-hero { margin-bottom: 50px; padding-bottom: 36px; } }

        .gallery-page__title {
            font-family: var(--serif);
            font-size: clamp(40px, 7vw, 96px);
            font-weight: 300;
            line-height: 0.98;
            letter-spacing: -0.02em;
            color: var(--fg);
        }
        .gallery-page__title .ital { font-style: italic; color: var(--gold); font-weight: 400; }

        .gallery-page__meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        .gallery-page__category {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.22em;
            color: var(--gold);
            text-transform: uppercase;
        }
        .gallery-page__count {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--fg-mute);
            text-transform: uppercase;
        }
        .gallery-page__description {
            font-size: 17px;
            color: var(--fg-dim);
            line-height: 1.75;
            font-weight: 300;
            max-width: 720px;
            margin-top: 16px;
        }
        @media (max-width: 600px) { .gallery-page__description { font-size: 15px; } }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }
        @media (max-width: 900px) {
            .gallery-grid { gap: 16px; }
        }
        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; gap: 12px; }
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            background: var(--bg-1);
            cursor: zoom-in;
            aspect-ratio: 4/3;
            transition: transform 0.4s cubic-bezier(.2, .7, .2, 1);
        }
        .gallery-item:nth-child(3n+1) { aspect-ratio: 4/5; }
        .gallery-item:nth-child(5n+3) { aspect-ratio: 16/9; }
        @media (max-width: 600px) {
            .gallery-item, .gallery-item:nth-child(3n+1), .gallery-item:nth-child(5n+3) { aspect-ratio: 4/3; }
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 1s cubic-bezier(.2, .7, .2, 1), opacity 0.5s;
            opacity: 0;
        }
        .gallery-item img.loaded { opacity: 1; }
        .gallery-item:hover img { transform: scale(1.04); }

        .gallery-item__overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, 0.5));
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }
        .gallery-item:hover .gallery-item__overlay { opacity: 1; }
        .gallery-item__num {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--fg);
            text-transform: uppercase;
        }

        /* Loading state */
        .gallery-loading {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .gallery-loading__mark {
            width: 8px;
            height: 8px;
            background: var(--gold);
            animation: pulse 1.4s ease-in-out infinite;
        }
        .gallery-loading__text {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--fg-mute);
            text-transform: uppercase;
        }

        /* Error state */
        .gallery-error {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            text-align: center;
        }
        .gallery-error__title {
            font-family: var(--serif);
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 300;
            color: var(--fg);
        }
        .gallery-error__text {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--fg-mute);
            text-transform: uppercase;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .lightbox.open { opacity: 1; visibility: visible; }
        .lightbox__close,
        .lightbox__nav {
            position: absolute;
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid var(--line-2);
            color: var(--fg);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 201;
        }
        .lightbox__close:hover,
        .lightbox__nav:hover {
            background: var(--gold);
            color: #0a0a0a;
            border-color: var(--gold);
        }
        .lightbox__close { top: 24px; left: 24px; }
        .lightbox__nav--prev { right: 24px; top: 50%; transform: translateY(-50%); }
        .lightbox__nav--next { left: 24px; top: 50%; transform: translateY(-50%); }
        @media (max-width: 600px) {
            .lightbox__close { top: 16px; left: 16px; width: 40px; height: 40px; }
            .lightbox__nav { width: 40px; height: 40px; }
            .lightbox__nav--prev { right: 12px; }
            .lightbox__nav--next { left: 12px; }
        }
        .lightbox__close svg,
        .lightbox__nav svg { width: 20px; height: 20px; }
        .lightbox__image-container {
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox__image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }
        .lightbox__counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--fg-mute);
            text-transform: uppercase;
        }

        /* Back to top */
        .back-to-top {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 48px;
            height: 48px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line-2);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 90;
        }
        .back-to-top.visible { opacity: 1; transform: translateY(0); }
        .back-to-top:hover { background: var(--gold); color: #0a0a0a; border-color: var(--gold); }
        .back-to-top svg { width: 20px; height: 20px; }
    </style>
</head>

<body>
    <a href="#main" class="skip-link">דלג לתוכן</a>

    <nav class="nav" id="nav" role="navigation" aria-label="ניווט ראשי">
        <a href="/" class="nav-brand" id="navBrand" aria-label="לאה בודיק - בית">
            <span id="navBrandText">לאה בודיק</span>
            <span class="mark" aria-hidden="true"></span>
        </a>
        <div class="nav-links">
            <a href="/">בית</a>
            <a href="/#about">אודות</a>
            <a href="/#projects">פרויקטים</a>
            <a href="/#testimonials">המלצות</a>
            <a href="/#contact">צור קשר</a>
        </div>
        <a href="/#contact" class="nav-cta">קביעת פגישה</a>
        <button class="nav-burger" id="navBurger" aria-label="פתח תפריט" aria-expanded="false" aria-controls="mobileDrawer">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
        <ul class="mobile-drawer__list">
            <li><a href="/" data-drawer-close>בית</a></li>
            <li><a href="/#about" data-drawer-close>אודות</a></li>
            <li><a href="/#projects" data-drawer-close>פרויקטים</a></li>
            <li><a href="/#testimonials" data-drawer-close>המלצות</a></li>
            <li><a href="/#contact" data-drawer-close>צור קשר</a></li>
        </ul>
        <a href="/#contact" class="mobile-drawer__cta" data-drawer-close>קביעת פגישה</a>
    </div>

    <main id="main">
        <div class="container gallery-page">
            <a href="/#projects" class="gallery-back">חזרה לפרויקטים</a>

            <div class="gallery-loading" id="gallery-loading">
                <div class="gallery-loading__mark"></div>
                <div class="gallery-loading__text">Loading</div>
            </div>

            <div class="gallery-error" id="gallery-error" style="display: none;">
                <h1 class="gallery-error__title">הגלריה לא נמצאה</h1>
                <p class="gallery-error__text">נסי לחזור לדף הבית</p>
                <a href="/" class="hero-cta"><span>חזרה לאתר</span></a>
            </div>

            <div class="gallery-hero" id="gallery-hero" style="display: none;">
                <h1 class="gallery-page__title" id="gallery-title">טוען...</h1>
                <div class="gallery-page__meta">
                    <span class="gallery-page__category" id="gallery-category"></span>
                    <span class="gallery-page__count" id="gallery-count"></span>
                </div>
                <p class="gallery-page__description" id="gallery-description" style="display: none;"></p>
            </div>

            <div class="gallery-grid" id="gallery-grid" style="display: none;"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-meta">
                    <span id="footerCopyright">© 2026 LEAH BUDIK STUDIO</span>
                </div>
                <div class="footer-brand">
                    <span>לאה בודיק</span> <span class="mark" aria-hidden="true"></span>
                </div>
                <div class="footer-credits" id="footerCredits"></div>
            </div>
        </div>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-label="תצוגת תמונה" aria-hidden="true">
        <button class="lightbox__close" id="lightbox-close" aria-label="סגור">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="הקודם">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <div class="lightbox__image-container">
            <img src="" alt="" class="lightbox__image" id="lightbox-image">
        </div>
        <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="הבא">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>
        <div class="lightbox__counter" id="lightbox-counter">1 / 1</div>
    </div>

    <button class="back-to-top" id="back-to-top" aria-label="חזרה למעלה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
    </button>

    <script src="/public/js/gallery.js" defer></script>
</body>

</html>
